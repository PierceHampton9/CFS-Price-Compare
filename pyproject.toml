[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfs-price-compare"
version = "0.4.0"
description = "Command-line pricing helper for donated devices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
amazon = [
    "playwright>=1.50",
]

[project.scripts]
pc_pricer = "pc_pricer.cli:main"
pc_pricer_gui = "pc_pricer.gui:main"

[tool.setuptools.packages.find]
include = ["pc_pricer*"]
