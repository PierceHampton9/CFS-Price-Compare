# Tuning values will live here as the pricing pipeline grows.

default_condition: good
default_limit: 10
default_limit_per_query: 10
min_comparables: 5
warn_below_comparables: 10
wide_iqr_ratio: 0.40
support_limit: 5
high_shipping_cad: 75
high_shipping_ratio: 0.25
asking_discount_low: 0.00
asking_discount_high: 0.05
max_sold_listing_age_days: 90
max_asking_listing_age_days: 30

sources:
  ebay:
    enabled: true
    marketplace: EBAY_CA
  refurb_io:
    enabled: true
    base_url: https://ca.refurb.io
  amazon_renewed:
    enabled: false
    base_url: https://www.amazon.ca
    browser: chromium
    channel: msedge
    headless: false
    timeout_ms: 15000
    max_product_pages: 5
  canada_computers:
    enabled: false
